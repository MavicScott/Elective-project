<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SDG 15: Life on Land</title>

    <!-- AOS CSS -->
    <link rel="stylesheet" href="https://unpkg.com/aos@2.3.1/dist/aos.css" />

    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: "Arial", sans-serif;
            color: #fff;
            min-height: 100vh;
            background: url(https://www.celebritycruises.com/blog/content/uploads/2024/04/rainforest-destinations-iguazu%CC%81-national-park-argentinabrazil-1024x713.jpg) no-repeat center center fixed;
            background-size: cover;
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        h1 {
            font-size: 3em;
            margin-bottom: 15px;
        }
        
        p {
            font-size: 1.4em;
            max-width: 800px;
            line-height: 1.6em;
            background: rgba(0, 0, 0, 0.4);
            padding: 20px;
            border-radius: 12px;
        }

<body>

    <h1 data-aos="zoom-in" data-aos-duration="1500">
        Welcome to SDG 15: Life on Land
    </h1>

    <p data-aos="fade-up" data-aos-duration="2000">
        “Protect, restore and promote sustainable use of terrestrial ecosystems, sustainably manage forests, combat desertification, and halt and reverse land degradation and halt biodiversity loss.”

    <!-- AOS Script -->
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>

        AOS.init();
