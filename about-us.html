<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>About Us - SDG 15</title>

    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">

    <style>
        body {
            margin: 0;
            font-family: "Poppins", sans-serif;
            background: url(https://unreasonablegroup.com/articles/wp-content/uploads/2018/11/Screen-Shot-2018-11-19-at-11.06.03-AM.png) no-repeat center center/cover;
            height: 100vh;
            overflow-x: hidden;
            color: #fff;
        }
        
        .overlay {
            background: rgba(0, 0, 0, 0.45);
            position: absolute;
            inset: 0;
            backdrop-filter: blur(3px);
        }
        
        .container {
            position: relative;
            padding: 80px 20px;
            z-index: 2;
            text-align: center;
        }
        
        h1 {
            font-size: 3rem;
            text-shadow: 0 0 25px #8aff9c;
        }
        
        p {
            width: 70%;
            margin: auto;
            margin-top: 20px;
            font-size: 1.2rem;
            text-shadow: 0 0 15px #0f0;
        }
        
        a {
            display: inline-block;
            margin-top: 40px;
            padding: 12px 25px;
            color: #fff;
            border: 2px solid #c8ffc8;
            border-radius: 10px;
            text-decoration: none;
            transition: 0.3s;
        }
        
        a:hover {
            background: #b5ffb5;
            color: #000;
            box-shadow: 0 0 20px #8cff8c;
        }
    </style>
</head>

<body>

    <div class="overlay"></div>

    <div class="container">
        <h1 data-aos="fade-down">About SDG 15</h1>

        <p data-aos="fade-up" data-aos-delay="300">
            SDG 15 focuses on protecting the planet’s forests, wildlife, and natural habitats. It raises awareness about biodiversity, deforestation, land restoration, and sustainable ecosystems.
        </p>

        <a href="index.html" data-aos="zoom-in" data-aos-delay="600">⬅ Back to Home</a>

    <script>
        AOS.init();
    </script>

</body>

</html>
