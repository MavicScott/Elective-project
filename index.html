<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SDG 15 - Life on Land</title>

    <!-- AOS Animation Library -->
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">

    <style>
        body {
            margin: 0;
            font-family: "Poppins", sans-serif;
            background: url(https://www.celebritycruises.com/blog/content/uploads/2024/04/rainforest-destinations-iguazu%CC%81-national-park-argentinabrazil-1024x713.jpg) no-repeat center center/cover;
            height: 100vh;
            overflow-x: hidden;
            color: #fff;
        }
        /* Forest Glow */
        
        .overlay {
            background: rgba(0, 0, 0, 0.45);
            backdrop-filter: blur(3px);
            position: absolute;
            inset: 0;
        }
        
        header {
            position: relative;
            text-align: center;
            padding: 90px 20px;
            z-index: 2;
        }
        
        h1 {
            font-size: 3.5rem;
            text-shadow: 0 0 25px #91ff9d;
        }
        
        p {
            font-size: 1.2rem;
            width: 70%;
            margin: auto;
            text-shadow: 0 0 10px #0f0;
        }
        /* Floating particles */
        
        .particle {
            position: absolute;
            width: 5px;
            height: 5px;
            background: #aaffaa;
            border-radius: 50%;
            animation: float 6s infinite ease-in-out;
            opacity: 0.8;
        }
        
        @keyframes float {
            0% {
                transform: translateY(0) scale(1);
            }
            50% {
                transform: translateY(-60px) scale(1.3);
            }
            100% {
                transform: translateY(0) scale(1);
            }
        }
        
        nav {
            margin-top: 30px;
        }
        
        nav a {
            color: #ffffff;
            padding: 12px 25px;
            text-decoration: none;
            border: 2px solid #c8ffc8;
            border-radius: 8px;
            margin: 0 10px;
            transition: 0.3s;
        }
        
        nav a:hover {
            background: #b5ffb5;
            color: #000;
            box-shadow: 0 0 20px #8cff8c;
        }
    </style>
</head>

<body>

    <div class="overlay"></div>

    <!-- Floating particles -->
    <div class="particle" style="top: 85%; left: 20%; animation-delay: 0s;"></div>
    <div class="particle" style="top: 60%; left: 50%; animation-delay: 1s;"></div>
    <div class="particle" style="top: 70%; left: 80%; animation-delay: 2s;"></div>
    <div class="particle" style="top: 40%; left: 30%; animation-delay: 3s;"></div>
    <div class="particle" style="top: 50%; left: 10%; animation-delay: 4s;"></div>

    <header>
        <h1 data-aos="fade-down">SDG 15: Life on Land</h1>
        <p data-aos="fade-up" data-aos-delay="300">
            Protect, restore, and promote sustainable use of terrestrial ecosystems.
        </p>

        <nav data-aos="zoom-in" data-aos-delay="500">
            <a href="index.html">Home</a>
            <a href="about-us.html">About Us</a>
            <a href="gallery.html">Gallery</a>

        </nav>
    </header>

    <!-- AOS Library -->
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script>
        AOS.init();
    </script>

</body>

</html>
